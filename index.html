<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="bigbutton" id="red">
            <button class="redbtn" id="redMinus">-</button>
            <p id="count"></p>
            <button class="redbtn" id="redPlus">+</button>
        </div>
        <div class="bigbutton" id="blue">
            <button class="bluebtn" id="blueMinus">-</button>
            <p id="total"></p>
            <button class="bluebtn" id="bluePlus">+</button>
        </div>

    <script>
        let playCount = 1;
        let totalCount = 1;
        document.getElementById("count").innerHTML = playCount;
        document.getElementById("total").innerHTML = totalCount;
        document.getElementById("redPlus").addEventListener("click", countincrement); 
        document.getElementById("bluePlus").addEventListener("click", totalincrement);
        document.getElementById("redMinus").addEventListener("click", countdecrement);
        document.getElementById("blueMinus").addEventListener("click", totaldecrement);
        
        function countincrement() {
        document.getElementById("count").innerHTML = playCount += 1;
        }

        function totalincrement() {
            document.getElementById("total").innerHTML = totalCount += 1;
        }

        function countdecrement() {
            document.getElementById("count").innerHTML = playCount -= 1;
        }

        function totaldecrement() {
            document.getElementById("total").innerHTML = totalCount -= 1;
        }
    </script>
    </body>
</html>
